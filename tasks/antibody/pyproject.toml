[project]
name = "ldm-tts-antibody"
version = "0.1.0"
description = "Antibody task workflow for the shared LDM-TTS runner."
requires-python = ">=3.9,<3.10"
dependencies = [
    "botorch==0.5.0",
    "gpytorch==1.5.0",
    "joblib==1.0.1",
    "numpy==1.20.3",
    "openai>=1.99.0",
    "pandas==1.3.2",
    "python-dotenv>=1.0",
    "pyyaml==5.4.1",
    "scikit-learn==0.24.2",
    "scipy==1.7.0",
    "torch==1.9.0",
    "transformers==4.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=4.0",
]

[tool.uv]
package = false
