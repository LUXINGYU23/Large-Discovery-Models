[project]
name = "ldm-tts-researchgym"
version = "0.1.0"
description = "LDM search over source-pinned ResearchGym method programs scored by the official graders."
requires-python = ">=3.10"
# Controller-side dependencies only. Each case's training/grading environment is
# the pinned upstream case requirements file, installed separately (see README).
dependencies = [
    "numpy>=1.24,<3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false
