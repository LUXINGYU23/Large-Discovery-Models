<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#7193a5"/></marker></defs><rect width="1100" height="510" rx="12" fill="#f4f8fb"/><g font-family="Noto Sans CJK SC,sans-serif"><rect x="26" y="30" width="325" height="185" rx="12" fill="white" stroke="#cbdae4" stroke-width="2"/><text x="46" y="66" fill="#216b8c" font-size="22" font-weight="bold">1 观测驱动初始化</text><text x="46" y="108" fill="#425b70" font-size="19">正负观测最近邻距离</text><text x="46" y="143" fill="#425b70" font-size="19">构造初始占据体</text><text x="46" y="178" fill="#425b70" font-size="19">限制在公开可行域内</text><rect x="388" y="30" width="325" height="185" rx="12" fill="white" stroke="#cbdae4" stroke-width="2"/><text x="408" y="66" fill="#216b8c" font-size="22" font-weight="bold">2 多尺度球形翻转</text><text x="408" y="108" fill="#425b70" font-size="19">随机可行中心与物理半径</text><text x="408" y="143" fill="#425b70" font-size="19">球内矿体 / 非矿体互换</text><text x="408" y="178" fill="#425b70" font-size="19">局部增、减或改变连通关系</text><rect x="750" y="30" width="325" height="185" rx="12" fill="white" stroke="#cbdae4" stroke-width="2"/><text x="770" y="66" fill="#216b8c" font-size="22" font-weight="bold">3 约束检查与修复</text><text x="770" y="108" fill="#425b70" font-size="19">活动区与禁入区</text><text x="770" y="143" fill="#425b70" font-size="19">体积范围、连通体数量</text><text x="770" y="178" fill="#425b70" font-size="19">不合法先修复再评分</text><rect x="26" y="292" width="325" height="185" rx="12" fill="white" stroke="#cbdae4" stroke-width="2"/><text x="46" y="328" fill="#216b8c" font-size="22" font-weight="bold">4 退火接受 / 拒绝</text><text x="46" y="370" fill="#425b70" font-size="19">更优提议接受</text><text x="46" y="405" fill="#425b70" font-size="19">较差提议按温度概率接受</text><text x="46" y="440" fill="#425b70" font-size="19">温度随时间线性降低</text><rect x="388" y="292" width="325" height="185" rx="12" fill="white" stroke="#cbdae4" stroke-width="2"/><text x="408" y="328" fill="#216b8c" font-size="22" font-weight="bold">5 边界双尺度精修</text><text x="408" y="370" fill="#425b70" font-size="19">从矿体边界随机选点</text><text x="408" y="405" fill="#425b70" font-size="19">比较3×3×3与7×7×7翻转</text><text x="408" y="440" fill="#425b70" font-size="19">按公开损失寻找局部改进</text><rect x="750" y="292" width="325" height="185" rx="12" fill="white" stroke="#cbdae4" stroke-width="2"/><text x="770" y="328" fill="#216b8c" font-size="22" font-weight="bold">6 输出与独立评分</text><text x="770" y="370" fill="#425b70" font-size="19">合法性校验后返回几何</text><text x="770" y="405" fill="#425b70" font-size="19">隐藏确认观测独立打分</text><text x="770" y="440" fill="#425b70" font-size="19">报告指标取既有评分收据</text></g><g stroke="#7193a5" fill="none" stroke-width="3" marker-end="url(#arrow)"><path d="M353 123H379"/><path d="M715 123H742"/><path d="M912 218V242H188V282"/><path d="M353 385H379"/><path d="M715 385H742"/></g><text x="550" y="266" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="17" fill="#607386">步骤2 → 3 → 4反复进行，达到退火截止时间后进入精修</text></svg>