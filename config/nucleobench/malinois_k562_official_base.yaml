name: nucleobench_malinois_k562_official
task: nucleobench
algorithm: ldm_official_wall_time
mode: real
description: Official wall-time-limited Malinois K562 campaign.
contract_profile: official_benchmark_malinois_k562
args:
  execution-profile: official_benchmark
  termination-kind: wall_time
  initialization-mode: official_start
  case-id: malinois_k562
  search-method: ldm
  proposal-mode: openai
  max-seconds: 28800
  evaluations-per-round: 16
  proposal-samples: 64
  proposal-max-workers: 4
  acquisition-beta: 1.0
  gp-noise-variance: 1.0e-4
  gp-jitter: 1.0e-8
  gp-target-std-floor: 0.1
  gp-min-history-for-fit: 4
  gp-max-observations: 256
  gp-global-best-observations: 64
  alpha: 1.0
  eta: 1.0
  z-clip: 5.0
  campaign-index: 0
  start-index: 0
  source-dir: ${NUCLEOBENCH_SOURCE_ROOT}
  prepared-dir: ${NUCLEOBENCH_DATA_ROOT}/malinois_k562
  expected-start-set-sha256: ${NUCLEOBENCH_START_SET_SHA256}
  hardware-profile: n1-highmem-16-cpu
  llm-url: null
  llm-model-name: null
  llm-wire-api: responses
  llm-reasoning: max
  llm-timeout: 600.0
  llm-max-tokens: 4096
  llm-temperature: 0.7
  api-key-file: ${NUCLEOBENCH_API_KEY_FILE}
  harness-image: ldm-pi-harness:latest
  harness-candidates-per-session: 16
  harness-thinking: max
  harness-cache-dir: ${NUCLEOBENCH_WORK_ROOT}/gondolin-cache
  harness-response-timeout: 2100.0
  harness-wall-time-seconds: 1800
  out-dir: ${NUCLEOBENCH_RUNS_ROOT}/official_benchmark
env:
  CUDA_VISIBLE_DEVICES: ""
  LDM_DATA_COLLECTION_ENABLED: "1"
