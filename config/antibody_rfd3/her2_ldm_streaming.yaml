name: antibody_rfd3_her2_ldm_streaming
task: antibody_rfd3
algorithm: ldm_harness
mode: real
description: Overlapping research and HER2 evaluation with a 64-candidate pool and a 32-evaluation window.
args:
  method: ldm_harness
  oracle: absolut
  antigen: 1N8Z_C
  iterations: 640
  research-rounds: 64
  pacing-mode: streaming
  evaluation-window: 32
  research-candidates-per-role: 32
  concurrency: 4
  pool-size: 64
  backbones-per-round: 16
  sequences-per-round: 512
  samples-per-call: 32
  temperature: 0.5
  seed: 42
  gpu: 0
  share-gpu: true
  cpu-limit: 8
  rfd3-checkpoint: /Aidata/shared/ldm/cache/streaming-models/rfd3.ckpt
  proteinmpnn-checkpoint: /Aidata/shared/ldm/cache/streaming-models/v_48_020.pt
  sidecar-image: ldm-copper-pi:antibody-async-20261118
  guest-cache: /Aidata/shared/ldm/antibody-poc/cache/gondolin
  out-dir: runs/her2_ldm_streaming
