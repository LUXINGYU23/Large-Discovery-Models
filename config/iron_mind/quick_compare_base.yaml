name: iron_mind_quick_compare
task: iron_mind
algorithm: ldm_bo_llm_quick_compare
mode: real
description: Fixed-budget six-round comparison base for Iron Mind.
contract_profile: quick_compare
args:
  proposal-mode: openai
  search-method: ldm
  initialization-mode: shared_random
  dataset-id: reductive_amination
  iterations: 6
  proposal-samples: 64
  bo-pool-size: 32
  proposal-max-workers: 64
  evaluations-per-round: 1
  acquisition-beta: 1.0
  alpha: 1.0
  eta: 3.0
  z-clip: 5.0
  campaign-index: 0
  data-dir: ${IRON_MIND_DATA_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  llm-timeout: 120.0
  llm-max-tokens: 512
  llm-temperature: 0.7
  prompt-policy: portfolio_v1
  out-dir: ${IRON_MIND_RUNS_ROOT}/quick_compare
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
