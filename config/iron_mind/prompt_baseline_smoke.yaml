name: iron_mind_prompt_baseline_smoke
task: iron_mind
algorithm: ucb
mode: real
description: One real LDM evaluation with the frozen legacy Iron Mind prompt.
contract_profile: ldm_prompt_baseline_smoke
args:
  proposal-mode: openai
  dataset-id: reductive_amination
  iterations: 1
  reservoir-size: 64
  proposal-max-workers: 64
  evaluations-per-round: 1
  acquisition-beta: 1.0
  campaign-index: 0
  data-dir: ${IRON_MIND_DATA_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  llm-timeout: 120.0
  llm-max-tokens: 512
  llm-temperature: 0.7
  prompt-policy: baseline_v1
  out-dir: ${IRON_MIND_RUNS_ROOT}/prompt_baseline_smoke
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
