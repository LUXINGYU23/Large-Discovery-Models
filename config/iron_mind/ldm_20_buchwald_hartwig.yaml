name: iron_mind_buchwald_hartwig_ldm_20
task: iron_mind
algorithm: ldm_tilted_ucb
mode: real
description: Our LDM method on the official buchwald_hartwig oracle with 20 evaluations.
contract_profile: ldm_official_20
args:
  proposal-mode: openai
  dataset-id: buchwald_hartwig
  iterations: 20
  proposal-samples: 64
  bo-pool-size: 32
  proposal-max-workers: 64
  evaluations-per-round: 1
  acquisition-beta: 1.0
  alpha: 1.0
  eta: 3.0
  z-clip: 5.0
  campaign-index: 0
  data-dir: ${IRON_MIND_DATA_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  llm-timeout: 120.0
  llm-max-tokens: 512
  llm-temperature: 0.7
  prompt-policy: portfolio_v1
  out-dir: ${IRON_MIND_RUNS_ROOT}/official_complete
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
