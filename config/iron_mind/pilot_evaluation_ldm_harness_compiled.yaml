name: iron_mind_pilot_evaluation_ldm_harness_compiled
task: iron_mind
algorithm: harness_compiled_ldm
mode: real
description: Fixed-budget six-round Harness-Compiled LDM comparison for Iron Mind.
contract_profile: pilot_evaluation_ldm_harness_compiled
args:
  proposal-mode: none
  search-method: ldm_harness_compiled
  initialization-mode: shared_random
  dataset-id: reductive_amination
  iterations: 6
  proposal-samples: 64
  bo-pool-size: 32
  proposal-max-workers: 4
  evaluations-per-round: 1
  acquisition-beta: 1.0
  alpha: 1.0
  eta: 1.0
  z-clip: 2.0
  harness-candidates-per-session: 16
  harness-thinking: max
  harness-wall-time-seconds: 1800
  harness-response-timeout: 2100
  harness-sidecar-image: ldm-pi-harness:latest
  harness-cache-dir: ${IRON_MIND_WORK_ROOT}/gondolin-cache
  policy-capability:
    - ldm_weights@1
    - prior_mean@1
  policy-tool-budget:
    - web_search=8
    - fetch_content=16
    - get_search_content=16
    - resolve-library-id=4
    - query-docs=8
  policy-max-submission-attempts: 3
  campaign-index: 0
  data-dir: ${IRON_MIND_DATA_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  out-dir: ${IRON_MIND_RUNS_ROOT}/pilot_evaluation_ldm_harness_compiled
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
