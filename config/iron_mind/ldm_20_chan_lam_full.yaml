name: iron_mind_chan_lam_full_ldm_20
task: iron_mind
algorithm: ucb
mode: real
description: Our LDM method on the official chan_lam_full oracle with 20 evaluations.
contract_profile: ldm_official_20
args:
  proposal-mode: openai
  dataset-id: chan_lam_full
  iterations: 20
  reservoir-size: 64
  proposal-max-workers: 64
  evaluations-per-round: 1
  acquisition-beta: 1.0
  campaign-index: 0
  data-dir: ${IRON_MIND_DATA_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  llm-timeout: 120.0
  llm-max-tokens: 512
  llm-temperature: 0.7
  out-dir: ${IRON_MIND_RUNS_ROOT}/official_complete
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
