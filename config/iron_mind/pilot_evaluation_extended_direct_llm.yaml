name: iron_mind_pilot_evaluation_extended_direct_llm
task: iron_mind
algorithm: direct_llm_pilot_evaluation_extended
mode: real
description: Fixed-budget twelve-round direct LLM comparison for Iron Mind.
contract_profile: pilot_evaluation_extended_direct_llm
args:
  proposal-mode: openai
  search-method: llm
  initialization-mode: shared_random
  dataset-id: reductive_amination
  iterations: 12
  proposal-samples: 64
  bo-pool-size: 63
  proposal-max-workers: 64
  evaluations-per-round: 1
  acquisition-beta: 1.0
  alpha: 1.0
  eta: 3.0
  z-clip: 5.0
  campaign-index: 0
  data-dir: ${IRON_MIND_DATA_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  llm-timeout: 120.0
  llm-max-tokens: 512
  llm-temperature: 0.7
  prompt-policy: direct_v1
  out-dir: ${IRON_MIND_RUNS_ROOT}/pilot_evaluation_extended
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
