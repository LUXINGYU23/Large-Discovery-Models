name: iron_mind_harness_official_smoke
task: iron_mind
algorithm: persistent_agent_harness_ldm
mode: real
description: Two-round real capability gate for the persistent Iron Mind research harness.
contract_profile: harness_official_smoke
args:
  proposal-backend: harness
  proposal-mode: none
  search-method: ldm
  initialization-mode: shared_random
  dataset-id: reductive_amination
  iterations: 2
  proposal-samples: 64
  bo-pool-size: 32
  proposal-max-workers: 6
  evaluations-per-round: 1
  acquisition-beta: 1.0
  alpha: 1.0
  eta: 1.0
  z-clip: 5.0
  harness-candidates-per-session: 16
  harness-thinking: max
  harness-wall-time-seconds: 1800
  harness-response-timeout: 2100
  harness-image: ldm-pi-harness:latest
  harness-cache-dir: ${IRON_MIND_WORK_ROOT}/gondolin-cache
  campaign-index: 0
  data-dir: ${IRON_MIND_DATA_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  out-dir: ${IRON_MIND_RUNS_ROOT}/harness_smoke
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
