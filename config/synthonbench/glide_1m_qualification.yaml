name: synthonbench_glide_1m_qualification
task: synthonbench
algorithm: ldm_tilted_synthon_tanimoto_gp_ucb
mode: real
description: One LDM-selected qualification query against the official 1M Glide ligand-efficiency score table.
contract_profile: glide_1m_qualification
args:
  proposal-mode: openai
  scale: 1M
  target: kif11
  oracle-kind: glide
  iterations: 1
  proposal-samples: 64
  proposal-candidates-per-request: 16
  bo-pool-size: 32
  proposal-max-workers: 4
  evaluations-per-round: 1
  slate-size: 24
  reaction-allocation: product_weighted
  fingerprint-bits: 2048
  gp-landmarks: 256
  gp-kernel-jitter: 1.0e-8
  gp-signal-std: 1.0
  gp-mean-std: 1.0
  gp-observation-noise-std: 1.0
  gp-reaction-weight: 1.0
  acquisition-beta: 1.0
  alpha: 1.0
  eta: 1.0
  z-clip: 5.0
  prompt-policy: policy_v1
  data-dir: ${SYNTHONBENCH_DATA_ROOT}
  source-dir: ${SYNTHONBENCH_SOURCE_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  llm-timeout: 120.0
  llm-max-tokens: 2048
  llm-temperature: 0.7
  llm-extra-body-json: '{{"thinking":{{"type":"disabled"}}}}'
  out-dir: ${SYNTHONBENCH_RUNS_ROOT}/glide_1m_qualification
  audit-timeout: 900.0
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
