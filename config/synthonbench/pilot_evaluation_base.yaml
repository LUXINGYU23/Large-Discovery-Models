name: synthonbench_pilot_evaluation
task: synthonbench
algorithm: ldm_bo_llm_pilot_evaluation
mode: real
description: Fixed-budget six-round comparison base for SynthonBench.
contract_profile: pilot_evaluation
args:
  proposal-mode: openai
  search-method: ldm
  initialization-mode: shared_random
  scale: 1M
  target: kif11
  oracle-kind: surrogate
  iterations: 6
  proposal-samples: 64
  proposal-candidates-per-request: 16
  bo-pool-size: 32
  bo-search-samples: 64
  proposal-max-workers: 4
  evaluations-per-round: 16
  slate-size: 24
  reaction-allocation: product_weighted
  fingerprint-bits: 2048
  gp-landmarks: 256
  gp-kernel-jitter: 1.0e-8
  gp-signal-std: 1.0
  gp-mean-std: 1.0
  gp-observation-noise-std: 1.0
  gp-reaction-weight: 1.0
  acquisition-beta: 0.5
  alpha: 1.0
  eta: 1.0
  z-clip: 2.0
  prompt-policy: policy_v1
  campaign-index: 0
  data-dir: ${SYNTHONBENCH_DATA_ROOT}
  source-dir: ${SYNTHONBENCH_SOURCE_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  llm-timeout: 600.0
  llm-max-tokens: 2048
  llm-temperature: 0.7
  llm-extra-body-json: '{{"reasoning_effort":"max"}}'
  out-dir: ${SYNTHONBENCH_RUNS_ROOT}/pilot_evaluation
  audit-timeout: 900.0
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
