name: synthonbench_quick_compare_direct_llm
task: synthonbench
algorithm: direct_llm_quick_compare
mode: real
description: Fixed-budget six-round direct LLM comparison base for SynthonBench.
contract_profile: quick_compare_direct_llm
args:
  proposal-mode: openai
  search-method: llm
  initialization-mode: shared_random
  scale: 1M
  target: kif11
  oracle-kind: surrogate
  iterations: 6
  proposal-samples: 16
  bo-pool-size: 48
  bo-search-samples: 64
  proposal-max-workers: 16
  evaluations-per-round: 16
  slate-size: 24
  reaction-allocation: product_weighted
  fingerprint-bits: 2048
  gp-landmarks: 256
  gp-kernel-jitter: 1.0e-8
  gp-signal-std: 1.0
  gp-mean-std: 1.0
  gp-observation-noise-std: 1.0
  gp-reaction-weight: 1.0
  acquisition-beta: 0.5
  alpha: 1.0
  eta: 3.0
  z-clip: 5.0
  prompt-policy: direct_v1
  campaign-index: 0
  data-dir: ${SYNTHONBENCH_DATA_ROOT}
  source-dir: ${SYNTHONBENCH_SOURCE_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  llm-timeout: 120.0
  llm-max-tokens: 256
  llm-temperature: 0.7
  llm-extra-body-json: '{{"thinking":{{"type":"disabled"}}}}'
  out-dir: ${SYNTHONBENCH_RUNS_ROOT}/quick_compare
  audit-timeout: 900.0
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
