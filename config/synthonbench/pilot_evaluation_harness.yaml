name: synthonbench_pilot_evaluation_harness
task: synthonbench
algorithm: persistent_agent_harness_direct
mode: real
description: Fixed-budget six-round direct research Harness comparison for SynthonBench.
contract_profile: pilot_evaluation_harness
args:
  proposal-mode: none
  search-method: harness
  initialization-mode: shared_random
  scale: 1M
  target: kif11
  oracle-kind: surrogate
  iterations: 6
  proposal-samples: 16
  evaluations-per-round: 16
  harness-thinking: max
  harness-wall-time-seconds: 1800
  harness-response-timeout: 2100
  harness-sidecar-image: ldm-pi-harness:latest
  harness-cache-dir: ${SYNTHONBENCH_WORK_ROOT}/gondolin-cache
  campaign-index: 0
  data-dir: ${SYNTHONBENCH_DATA_ROOT}
  source-dir: ${SYNTHONBENCH_SOURCE_ROOT}
  llm-url: null
  llm-model-name: null
  api-key: null
  out-dir: ${SYNTHONBENCH_RUNS_ROOT}/pilot_evaluation_harness
  audit-timeout: 900.0
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
