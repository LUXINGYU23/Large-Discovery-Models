name: synthonbench_official_example
task: synthonbench
algorithm: ldm_tilted_synthon_tanimoto_gp_ucb
mode: mock
description: Deterministic contract run on SynthonBench's bundled official example space and Pairwise oracle.
args:
  mock: true
  proposal-mode: callable
  iterations: 2
  proposal-samples: 64
  bo-pool-size: 32
  proposal-max-workers: 64
  evaluations-per-round: 1
  slate-size: 24
  reaction-allocation: product_weighted
  fingerprint-bits: 2048
  gp-landmarks: 256
  gp-kernel-jitter: 1.0e-8
  gp-signal-std: 1.0
  gp-mean-std: 1.0
  gp-observation-noise-std: 1.0
  gp-reaction-weight: 1.0
  acquisition-beta: 1.0
  alpha: 1.0
  eta: 1.0
  z-clip: 5.0
  prompt-policy: policy_v1
  out-dir: runs
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
