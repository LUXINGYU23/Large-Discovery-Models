name: researchgym_mock_ldm
task: researchgym
algorithm: ldm_gp_ucb
mode: mock
args:
  mock: true
  case: continual_learning
  search-method: ldm
  iterations: 3
  proposal-samples: 6
  proposal-batch-size: 3
  bo-pool-size: 4
  evaluations-per-round: 2
  max-repair-requests: 2
  acquisition-alpha: 1.0
  acquisition-eta: 1.0
env:
  LDM_DATA_COLLECTION_ENABLED: "1"
