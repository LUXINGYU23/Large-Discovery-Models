name: researchgym_continual_learning_tiny_ldm_harness_compiled
task: researchgym
algorithm: ldm_harness_compiled
mode: real
contract_profile: continual_learning_tiny_ldm_harness_compiled
description: 'continual_learning: two-round compiled-policy pilot; draft.'
args:
  case: continual_learning
  search-method: ldm_harness_compiled
  iterations: 2
  proposal-samples: 4
  evaluations-per-round: 1
  bo-pool-size: 4
  initialization-mode: shared_start
  harness-sessions: 2
  upstream-root: ${RESEARCHGYM_ROOT}
  case-data-root: ${RESEARCHGYM_CASE_DATA_ROOT}
  case-python: ${RESEARCHGYM_CASE_PYTHON}
  devices: ${RESEARCHGYM_DEVICES}
  min-free-mib: 20000
  campaign-hours: 0
  llm-wire-api: responses
  llm-reasoning: high
  llm-max-tokens: 16384
  recovery-attempts: 3
  out-dir: ${RESEARCHGYM_RUNS_ROOT}
  harness-sidecar-image: ldm-pi-harness:latest
  harness-wall-time-seconds: 1800
  harness-response-timeout: 2400
  harness-tool-budget:
  - describe_researchgym_case=8
  - get_measured_history=24
  - check_candidate_programs=32
  - web_search=8
  - fetch_content=16
  - get_search_content=16
  proposal-mode: harness
  policy-runner-image: ldm-pi-harness:latest
  policy-tool-budget:
  - get_measured_history=16
  - web_search=8
  - fetch_content=16
env:
  LDM_DATA_COLLECTION_ENABLED: '1'
