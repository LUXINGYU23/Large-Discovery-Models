schema_version: 1
name: researchgym_pilot_evaluation
task: researchgym
base_config: ../researchgym/pilot_evaluation_base.yaml
cases:
  - id: time_series_explanation
    overrides:
      - args.case="time_series_explanation"
  - id: continual_learning
    overrides:
      - args.case="continual_learning"
  - id: cross_modal_retrieval
    overrides:
      - args.case="cross_modal_retrieval"
  - id: improving_replay_buffers
    overrides:
      - args.case="improving_replay_buffers"
# bo is intentionally absent: the task declares no score-blind program generator.
methods: [llm, ldm, harness, ldm_harness, ldm_harness_compiled]
method_overrides:
  llm: []
  ldm: []
  harness:
    - args.harness-sessions=1
  ldm_harness: []
  ldm_harness_compiled: []
seeds: [0, 1, 2]
optimization_rounds: 5
initialization_mode: shared_start
output_root: ${RESEARCHGYM_RUNS_ROOT}/pilot_evaluation
trajectory:
  step_column: evaluation
  step_kind: evaluation_index
  objective_column: score
  direction: maximize
result_fields: {}
policy_fields:
  baseline_prediction_mean: compiled_policy.baseline_prediction_diagnostics.mean_mean
  compiled_prediction_mean: compiled_policy.compiled_prediction_diagnostics.mean_mean
  prediction_mean_abs_change: compiled_policy.prediction_mean_abs_change
  q0_entropy: base_probability_entropy
  tilted_entropy: probability_entropy
  tilted_ess: probability_effective_sample_size
  tilted_kl_from_q0: tilted_kl_from_q0
  q0_tilted_topk_overlap: q0_tilted_topk_overlap
policy_mean_fields:
  - prediction_mean_abs_change
  - tilted_kl_from_q0
  - tilted_ess
