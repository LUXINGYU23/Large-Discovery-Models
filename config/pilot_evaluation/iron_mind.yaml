schema_version: 1
name: iron_mind_pilot_evaluation
task: iron_mind
base_config: ../iron_mind/pilot_evaluation_base.yaml
cases:
  - id: reductive_amination
    overrides:
      - args.dataset-id="reductive_amination"
  - id: buchwald_hartwig
    overrides:
      - args.dataset-id="buchwald_hartwig"
methods: [ldm, ldm_harness, bo, llm, harness]
method_overrides:
  ldm: []
  ldm_harness:
    - contract_profile="pilot_evaluation_ldm_harness"
    - args.harness-candidates-per-session=16
    - args.harness-thinking="max"
    - args.harness-wall-time-seconds=1800
    - args.harness-response-timeout=2100
    - args.harness-sidecar-image="ldm-pi-harness:latest"
    - args.harness-cache-dir="${IRON_MIND_WORK_ROOT}/gondolin-cache"
  bo: []
  llm:
    - contract_profile="pilot_evaluation_direct_llm"
    - args.prompt-policy="direct_v1"
  harness:
    - contract_profile="pilot_evaluation_harness"
    - args.proposal-samples=1
    - args.harness-thinking="max"
    - args.harness-wall-time-seconds=1800
    - args.harness-response-timeout=2100
    - args.harness-sidecar-image="ldm-pi-harness:latest"
    - args.harness-cache-dir="${IRON_MIND_WORK_ROOT}/gondolin-cache"
seeds: [0, 1, 2]
optimization_rounds: 5
initialization_mode: shared_random
output_root: ${IRON_MIND_RUNS_ROOT}/pilot_evaluation
trajectory:
  step_column: round
  step_kind: round
  objective_column: reaction_score
  direction: maximize
result_fields: {}
