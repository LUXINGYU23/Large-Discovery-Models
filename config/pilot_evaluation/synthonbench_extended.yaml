schema_version: 1
name: synthonbench_pilot_evaluation_extended
task: synthonbench
base_config: ../synthonbench/pilot_evaluation_extended.yaml
cases:
  - id: surrogate_1m_kif11
    overrides:
      - args.scale="1M"
      - args.target="kif11"
      - args.oracle-kind="surrogate"
methods: [ldm, ldm_harness, bo, llm]
method_overrides:
  ldm: []
  ldm_harness:
    - contract_profile="pilot_evaluation_extended_ldm_harness"
    - args.harness-candidates-per-session=16
    - args.harness-thinking="max"
    - args.harness-wall-time-seconds=1800
    - args.harness-response-timeout=2100
    - args.harness-image="ldm-pi-harness:latest"
    - args.harness-cache-dir="${SYNTHONBENCH_WORK_ROOT}/gondolin-cache"
  bo: []
  llm:
    - contract_profile="pilot_evaluation_extended_direct_llm"
    - args.prompt-policy="direct_v1"
    - args.proposal-samples=16
    - args.proposal-candidates-per-request=1
    - args.proposal-max-workers=4
    - args.llm-max-tokens=256
seeds: [0, 1, 2]
optimization_rounds: 11
initialization_mode: shared_random
output_root: ${SYNTHONBENCH_RUNS_ROOT}/pilot_evaluation_extended
trajectory:
  step_column: call_idx
  step_kind: evaluation_index
  objective_column: utility
  direction: maximize
result_fields:
  top_k_recall: official_metrics.top1000_recall
  call_reduction_factor_top_k: official_metrics.call_reduction_factor_top1000
  best_found_utility: best_found_utility
