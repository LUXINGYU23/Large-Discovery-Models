{
  "name": "reasyn_tdc_harness_tiny",
  "task": "reasyn",
  "algorithm": "harness",
  "mode": "real",
  "description": "Small persistent research integration run; draft scientific qualification.",
  "args": {
    "benchmark": "tdc",
    "search-method": "harness",
    "proposal-mode": "harness",
    "iterations": 2,
    "proposal-samples": 2,
    "proposal-batch-size": 2,
    "bo-pool-size": 2,
    "evaluations-per-round": 2,
    "num-cycles": 1,
    "exhaustiveness": 4,
    "num-editflow-samples": 4,
    "harness-sessions": 1,
    "harness-sidecar-image": "ldm-pi-harness:latest",
    "harness-thinking": "high",
    "harness-wall-time-seconds": 1800,
    "harness-response-timeout": 2100,
    "harness-tool-budget": [
      "describe_reasyn_task=8",
      "get_measured_history=16",
      "check_measured_product=32"
    ],
    "recovery-attempts": 3,
    "max-replenishment-batches": 4,
    "oracle": "jnk3",
    "max-oracle-calls": 10000
  }
}
